name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # every Monday, catches changes in the apps under test

jobs:
  ui:
    name: UI (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run UI tests in parallel
        run: >
          pytest tests/ui -n 4 --browser ${{ matrix.browser }}
          --html=reports/ui-${{ matrix.browser }}.html --self-contained-html
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: report-ui-${{ matrix.browser }}
          path: reports/

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/api --html=reports/api.html --self-contained-html
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: report-api
          path: reports/
